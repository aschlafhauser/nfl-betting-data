name: tmp append 49ers practice availability
on:
  push:
    paths:
      - '.github/workflows/tmp-append-49ers-practice-availability.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append governed NFL expert record
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('data/nfl-expert-weekly.json')
          obj = json.loads(p.read_text())
          rec = {
            "game_id":"c84dfc8c-8d90-4f80-a202-aa37d05e0c73",
            "source_family":"NBC Sports Bay Area / 49ers local reporting",
            "analyst":"Matt Maiocco / Kyle Shanahan / Nick Bosa",
            "source_date":"2026-09-07",
            "summary":"San Francisco's first full Week 1 practice in Melbourne had Nick Bosa and Christian McCaffrey absent from the open on-field portion. Bosa spent much of camp managing tendinitis in his surgically repaired right knee but has explicitly said he expects to play against the Rams. McCaffrey's Monday non-participation follows a managed camp ramp-up and carried no official practice designation because the 49ers were not yet required to issue one under the international schedule. George Kittle participated in individual drills, while several previously limited players were back. Treat Bosa and McCaffrey as live availability/conditioning watches rather than confirmed absences.",
            "timestamp":"2026-09-07T22:06:27Z",
            "independence":"team-local/correlated",
            "kind":"personnel/availability",
            "category":"practice participation / injury watch",
            "team":"San Francisco 49ers",
            "direction":"negative 49ers availability uncertainty for Bosa and McCaffrey, tempered by Bosa expectation to play and no official Monday designation",
            "conviction":"reported availability only — no wager inferred",
            "freshness":"current-week",
            "incremental_information":True,
            "model_relationship":"orthogonal-new-information",
            "construction_detail":"First Melbourne open practice: Bosa and McCaffrey did not participate; no betting construction stated"
          }
          key = (rec['source_family'], rec['game_id'], rec['analyst'], rec['construction_detail'])
          existing = {(r.get('source_family'), r.get('game_id'), r.get('analyst'), r.get('construction_detail')) for r in obj.get('records', [])}
          if key not in existing:
              obj.setdefault('records', []).append(rec)
              obj['generated_at'] = '2026-09-07T22:06:27Z'
              p.write_text(json.dumps(obj, separators=(',',':'), ensure_ascii=False))
          PY
      - name: Commit governed data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl-expert-weekly.json
          if git diff --cached --quiet; then
            echo "No governed data changes"
          else
            git commit -m "Add 49ers Week 1 practice availability intel"
            git push
          fi
