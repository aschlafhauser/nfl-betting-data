name: Refresh governed NFL weekly manifest
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh-nfl-weekly-manifest.yml'
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nfl-weekly-manifest
  cancel-in-progress: false
jobs:
  manifest:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Advance selected week after prior slate completes
        run: node scripts/rollover-selected-week.mjs
      - name: Read NFL selected-week control metadata
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('data/weekly-board.json','utf8'));const week=Number(b.week),games=Number(b.games?.length||0);if(!Number.isFinite(week)||games<=0)throw new Error('NFL weekly board missing valid week/slate');console.log(`NFL_WEEK=${week}`);console.log(`NFL_EXPECTED_GAMES=${games}`);
          NODE
      - name: Losslessly reconcile Expert Intelligence primary ledger
        run: node scripts/sync-expert-ledger.mjs
      - name: Install browser runtime
        if: ${{ always() }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Refresh canonical and live-portal NFL market runtime
        run: node scripts/refresh-live-portal-runtime.mjs
      - name: Rebuild selected-week models, prior-week stats, Deep Dives and upset research
        run: node scripts/rebuild-weekly-intelligence.mjs
      - name: Normalize current NFL team stats for Matchup Center
        run: node scripts/normalize-live-team-stats.mjs
      - name: Build NFL motion and scheme style matchup research
        run: node scripts/build-style-matchups.mjs
      - name: Enforce canonical-to-portal model synchronization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const canonical=JSON.parse(fs.readFileSync('data/weekly-board.json','utf8'));
          const portal=JSON.parse(fs.readFileSync('data/nfl-weekly-board.json','utf8'));
          const now=new Date().toISOString();
          const key=x=>String(x?.gameId||x?.canonical_game_id||x?.canonicalGameId||'');
          const byId=new Map((canonical.games||[]).map(g=>[key(g),g]));
          let matched=0;
          portal.games=(portal.games||[]).map(x=>{
            const g=byId.get(key(x));
            if(!g)return x;
            matched++;
            const marketHM=Number(x?.market?.home_margin);
            const fairHM=Number(g.productionHomeMargin);
            const edge=Number.isFinite(marketHM)&&Number.isFinite(fairHM)?Number((fairHM-marketHM).toFixed(3)):null;
            return {...x,
              stage:g.stage||x.stage,
              priority:g.priority||x.priority,
              why:`Selected-week governed model rebuilt ${now}; ${g.modelVersion||'NFL frozen model'}.`,
              model:{...(x.model||{}),
                fair_spread_display:g.productionSpread,
                fair_spread:g.productionSpread,
                fair_spread_home_margin:g.productionHomeMargin,
                structural_home_margin:g.structuralHomeMargin,
                structural_fair:g.validatedStructuralSpread,
                structural_edge:g.structuralEdge,
                executable_edge:edge,
                edge_side:edge>0?(x.home_abbr||g.homeAbbr):edge<0?(x.away_abbr||g.awayAbbr):'NONE',
                confidence:g.priority==='High'?'high-review':g.priority==='Medium'?'medium':'low',
                edge_reconciled_at:now,
                edge_convention:'production fair home margin - current market home margin',
                model_version:g.modelVersion||'NFL-v1.1'
              }
            };
          });
          if(matched!==(canonical.games||[]).length)throw new Error(`Portal model synchronization matched ${matched}/${(canonical.games||[]).length} canonical games`);
          const incomplete=portal.games.filter(x=>x.model?.fair_spread_home_margin==null||!x.model?.fair_spread_display||x.model?.executable_edge==null);
          if(incomplete.length)throw new Error(`Portal model synchronization left ${incomplete.length} game(s) incomplete: ${incomplete.map(key).join(', ')}`);
          portal.week=canonical.week;portal.generated_at=now;portal.model_runtime={status:'SYNCHRONIZED',canonicalWeek:canonical.week,matchedGames:matched,verifiedAt:now};
          fs.writeFileSync('data/nfl-weekly-board.json',JSON.stringify(portal,null,2)+'\n');
          console.log(`NFL portal model runtime synchronized ${matched}/${matched}; no null fairs/edges.`);
          NODE
      - name: Reconcile canonical NFL team identities
        run: node scripts/audit-team-identities.mjs
      - name: Freeze due immutable pre-kickoff snapshots after official inactives
        env:
          NFL_SNAPSHOT_LOOKAHEAD_MINUTES: '90'
        run: node scripts/freeze-pre-kickoff-snapshots.mjs
      - name: Capture immutable final results and CLV status when games complete
        run: node scripts/capture-results-clv.mjs
      - name: Rebuild selected-week manifest
        continue-on-error: true
        run: node scripts/refresh-weekly-manifest.mjs
      - name: Persist governed NFL runtime safely
        if: ${{ always() }}
        run: |
          set -e
          git config user.name 'nfl-runtime-bot'; git config user.email 'nfl-runtime-bot@users.noreply.github.com'; git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then git rebase origin/main || { git rebase --abort || true; exit 1; }; fi
          if ! git diff --quiet -- data/; then git add data/; git commit -m 'chore: refresh governed NFL runtime [skip ci]'; git push origin HEAD:main; fi
      - name: Enforce NFL weekly gates
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/verify-weekly-gates.mjs
      - name: Verify every live NFL portal tab
        if: ${{ always() }}
        env:
          NFL_PORTAL_URL: https://nfl-betting-intelligence.netlify.app/
        run: node scripts/verify-live-portal.mjs
